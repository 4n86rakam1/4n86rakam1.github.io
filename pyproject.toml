[project]
name = "4n86rakam1-github-io"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "pillow>=11.0.0",
    "pygments>=2.21.0",
    "pymdown-extensions>=11.0.2",
    "python-frontmatter>=1.3.0",
]

[dependency-groups]
dev = [
    "pagefind[bin]>=1.5.2",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
# The generator is run as `python -m ssg` from the repository root rather than
# installed, so the tests need the same root on the path.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "browser: needs a built site and a browser (run after the build)",
]
