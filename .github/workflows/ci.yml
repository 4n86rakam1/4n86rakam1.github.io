name: ci
on:
  repository_dispatch:
    types: [writeup-updated]
  push:
    branches:
      - main
  # security.txt `Expires` comes from the build date, so a site that is never
  # rebuilt serves an expired one. Off the hour and off the first because
  # GitHub drops scheduled runs at the popular times. GitHub also disables a
  # schedule after 60 days without repository activity, which a scheduled run
  # is not; a shorter lifetime would only make that lapse fall sooner.
  schedule:
    - cron: "17 4 8 * *"
  workflow_dispatch:

# Only the deploy job is trusted with Pages, through an identity it requests at
# run time; the build never writes to the repository.
permissions:
  contents: read

# Never cancel one halfway: a half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout writeup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 4n86rakam1/writeup
          path: content/writeup

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          # v9 flipped this default, and the cache then outgrows the 10 GB quota.
          prune-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Build the site
        run: uv run python -m ssg

      # The build wipes dist, so the index has to be written after it.
      - name: Build the search index
        run: uv run python -m pagefind --site dist

      # After the build and the index: the checks that read the real output skip
      # on a fresh runner, and the guard against publishing .git never once ran.
      - name: Run the tests
        run: uv run pytest -m "not browser"

      # Where playwright install puts browsers on Linux.
      - name: Restore the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install the browser
        run: uv run playwright install --with-deps chromium

      - name: Check the built site in a browser
        run: uv run pytest -m browser

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
