version: 2
updates:
  # Actions are pinned to commit SHAs, so nothing moves on its own and security
  # fixes would otherwise arrive only when someone goes looking for them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # uv.lock pins every Python dependency to a hash, including the Pagefind
  # binary, so the same argument applies to them.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
